name: MCP Publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Staged draft tag (mcp-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mcp-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Install archive verifier
        run: npm install --prefix "$RUNNER_TEMP/mcp-verifier" --ignore-scripts --no-audit --no-fund jszip@3.10.1
      - name: Download prebuilt draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^mcp-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir release/mcp
      - name: Verify distribution and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MCP_RELEASE_DIR: release/mcp
          MCP_VERIFIER_ROOT: ${{ runner.temp }}/mcp-verifier
        run: node scripts/publish-mcp.mjs
